name: Community Bot

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  MAINTAINER: helsome
  DEFAULT_CLAIM_DAYS: "14"
  MAX_CLAIM_DAYS: "30"

jobs:
  issue-claim:
    name: Handle issue claim commands
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Claim or release issue
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            if (!issue || issue.state !== 'open' || !comment) return;

            const actor = comment.user.login;
            const body = comment.body.trim();
            const claim = body.match(/^\/?(?:claim|take)(?:\s+(\d+)(d|w))?$/i);
            const release = /^\/?(?:release|unclaim|disclaim)$/i.test(body);
            if (!claim && !release) return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const { data: current } = await github.rest.issues.get({ owner, repo, issue_number });
            const assignees = (current.assignees || []).map(a => a.login);

            if (release) {
              const canRelease = actor === process.env.MAINTAINER || assignees.includes(actor);
              if (!canRelease) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: `@${actor} 当前认领人是 ${assignees.length ? assignees.map(a => `@${a}`).join(', ') : '其他贡献者'}，只有认领人或维护者可以释放。`
                });
                return;
              }

              if (assignees.length) {
                const toRemove = actor === process.env.MAINTAINER ? assignees : assignees.filter(a => a === actor);
                if (toRemove.length) {
                  try {
                    await github.rest.issues.removeAssignees({ owner, repo, issue_number, assignees: toRemove });
                  } catch (error) {
                    core.warning(`Unable to remove assignee: ${error.message}`);
                  }
                }
              }

              await removeLabel('claimed');
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `<!-- folio-claim-release -->\n已释放该任务。其他贡献者现在可以使用 \`/claim\` 认领。`
              });
              return;
            }

            let days = Number(process.env.DEFAULT_CLAIM_DAYS || 14);
            if (claim[1]) {
              const raw = Number(claim[1]);
              days = claim[2].toLowerCase() === 'w' ? raw * 7 : raw;
            }
            const maxDays = Number(process.env.MAX_CLAIM_DAYS || 30);
            days = Math.max(1, Math.min(days, maxDays));

            const otherAssignees = assignees.filter(a => a !== actor);
            if (otherAssignees.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `@${actor} 这个任务当前已由 ${otherAssignees.map(a => `@${a}`).join(', ')} 认领。若需要接手，请先与当前认领人沟通，或由维护者执行 \`/release\`。`
              });
              return;
            }

            await ensureLabel('claimed', '1d76db', 'Claimed by a contributor and currently in progress');
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['claimed'] });

            let assigned = true;
            if (!assignees.includes(actor)) {
              try {
                await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [actor] });
              } catch (error) {
                assigned = false;
                core.warning(`GitHub could not assign @${actor}: ${error.message}`);
              }
            }

            const now = new Date();
            const expires = new Date(now.getTime() + days * 24 * 60 * 60 * 1000);
            const marker = `<!-- folio-claim user=${actor} claimed_at=${now.toISOString()} expires_at=${expires.toISOString()} -->`;
            const assignmentNote = assigned ? '' : '\n\n> GitHub 未允许自动写入 Assignee，但 bot 已记录本次认领；每日巡检仍会按此记录处理。';

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `${marker}\n@${actor} 已认领该任务，认领有效期到 **${expires.toISOString().slice(0, 10)}**。\n\n- 开始提交 PR 时请在 PR 描述中写 \`Closes #${issue_number}\`\n- 需要续期：再次评论 \`/claim\` 或 \`/claim 2w\`\n- 不再处理：评论 \`/release\`${assignmentNote}`
            });

  pr-lifecycle:
    name: Maintain pull request review state
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Update PR state and request review
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;
            const action = context.payload.action;
            const maintainer = process.env.MAINTAINER;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            async function addLabel(name) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
            }

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            await ensureLabel('needs-review', 'fbca04', 'Ready for maintainer review');
            await ensureLabel('waiting-on-author', 'd93f0b', 'Changes requested; waiting for the PR author');
            await ensureLabel('approved', '0e8a16', 'Approved by a maintainer');

            if (action === 'closed') {
              await removeLabel('needs-review');
              await removeLabel('waiting-on-author');
              if (pr.merged) {
                await addLabel('approved');
                if (pr.user.login !== maintainer) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number,
                    body: `感谢 @${pr.user.login} 的贡献，PR 已合并。`
                  });
                }
              }
              return;
            }

            if (pr.draft) return;

            if (action === 'synchronize') {
              await removeLabel('waiting-on-author');
              await removeLabel('approved');
            }

            await addLabel('needs-review');

            if (pr.user.login !== maintainer) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner, repo, pull_number: pr.number, reviewers: [maintainer]
                });
              } catch (error) {
                core.warning(`Unable to request @${maintainer} review: ${error.message}`);
              }
            }

            if (['opened', 'reopened', 'ready_for_review'].includes(action)) {
              const firstTimer = ['FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR'].includes(pr.author_association);
              const welcome = firstTimer ? '欢迎第一次向 Folio 提交贡献。' : '感谢提交 Folio PR。';
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `${welcome}\n\nBot 已将此 PR 标记为 \`needs-review\`${pr.user.login !== maintainer ? `，并请求 @${maintainer} Review` : ''}。如果它解决某个 Issue，请确保描述中包含 \`Closes #<issue>\`。\n\n> 社区机器人只做状态流转和提醒，不会自动合并代码。`
              });
            }

  review-state:
    name: Reflect review decisions in labels
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Apply review state
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const review = context.payload.review;
            if (!pr || !review) return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;
            const state = String(review.state || '').toLowerCase();

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }
            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            await ensureLabel('needs-review', 'fbca04', 'Ready for maintainer review');
            await ensureLabel('waiting-on-author', 'd93f0b', 'Changes requested; waiting for the PR author');
            await ensureLabel('approved', '0e8a16', 'Approved by a maintainer');

            if (state === 'changes_requested') {
              await removeLabel('needs-review');
              await removeLabel('approved');
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['waiting-on-author'] });
            } else if (state === 'approved') {
              await removeLabel('needs-review');
              await removeLabel('waiting-on-author');
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['approved'] });
            }
