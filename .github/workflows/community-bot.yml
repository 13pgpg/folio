name: Community Bot

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  MAINTAINER: helsome
  DEFAULT_CLAIM_DAYS: "14"
  MAX_CLAIM_DAYS: "30"

jobs:
  community-event:
    name: Handle community event
    runs-on: ubuntu-latest
    steps:
      - name: Apply community workflow
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const maintainer = process.env.MAINTAINER;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            async function addLabel(issue_number, name) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
            }

            async function removeLabel(issue_number, name) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            async function ensureCommunityLabels() {
              await ensureLabel('claimed', '1d76db', 'Claimed by a contributor and currently in progress');
              await ensureLabel('needs-review', 'fbca04', 'Ready for maintainer review');
              await ensureLabel('waiting-on-author', 'd93f0b', 'Changes requested; waiting for the PR author');
              await ensureLabel('approved', '0e8a16', 'Approved by the maintainer');
            }

            await ensureCommunityLabels();

            if (context.eventName === 'issue_comment') {
              const issue = context.payload.issue;
              const comment = context.payload.comment;
              if (!issue || issue.pull_request || issue.state !== 'open' || !comment) return;

              const actor = comment.user.login;
              const body = comment.body.trim();
              const claim = body.match(/^\/?(?:claim|take)(?:\s+(\d+)(d|w))?$/i);
              const release = /^\/?(?:release|unclaim|disclaim)$/i.test(body);
              if (!claim && !release) return;

              const issue_number = issue.number;
              const { data: current } = await github.rest.issues.get({ owner, repo, issue_number });
              const assignees = (current.assignees || []).map(a => a.login);
              const labels = (current.labels || []).map(l => typeof l === 'string' ? l : l.name);

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100
              });
              const claimPattern = /<!-- folio-claim user=([^\s]+) claimed_at=([^\s]+) expires_at=([^\s]+) -->/;
              let activeClaim = null;
              if (labels.includes('claimed')) {
                for (let i = comments.length - 1; i >= 0; i--) {
                  const match = String(comments[i].body || '').match(claimPattern);
                  if (match) {
                    activeClaim = { user: match[1], claimedAt: match[2], expiresAt: match[3] };
                    break;
                  }
                }
              }

              if (release) {
                const canRelease = actor === maintainer || activeClaim?.user === actor || assignees.includes(actor);
                if (!canRelease) {
                  const holder = activeClaim?.user || assignees[0];
                  await github.rest.issues.createComment({
                    owner, repo, issue_number,
                    body: `@${actor} 当前${holder ? `由 @${holder} 认领` : '没有可由你释放的认领记录'}。只有认领人或维护者可以执行 \`/release\`。`
                  });
                  return;
                }

                const claimant = activeClaim?.user || (assignees.includes(actor) ? actor : null);
                if (claimant && assignees.includes(claimant)) {
                  try {
                    await github.rest.issues.removeAssignees({ owner, repo, issue_number, assignees: [claimant] });
                  } catch (error) {
                    core.warning(`Unable to remove assignee @${claimant}: ${error.message}`);
                  }
                }

                await removeLabel(issue_number, 'claimed');
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: '<!-- folio-claim-release -->\n已释放该任务。其他贡献者现在可以使用 `/claim` 认领。'
                });
                return;
              }

              if (activeClaim && activeClaim.user !== actor) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: `@${actor} 这个任务当前已由 @${activeClaim.user} 认领。若需要接手，请先与当前认领人沟通，或由维护者释放当前认领。`
                });
                return;
              }

              const otherAssignees = assignees.filter(a => a !== actor && a !== maintainer);
              if (!activeClaim && otherAssignees.length) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: `@${actor} 这个任务当前已有 Assignee：${otherAssignees.map(a => `@${a}`).join(', ')}。请先确认是否可以接手。`
                });
                return;
              }

              let days = Number(process.env.DEFAULT_CLAIM_DAYS || 14);
              if (claim[1]) {
                const raw = Number(claim[1]);
                days = claim[2].toLowerCase() === 'w' ? raw * 7 : raw;
              }
              days = Math.max(1, Math.min(days, Number(process.env.MAX_CLAIM_DAYS || 30)));

              await addLabel(issue_number, 'claimed');

              let assigned = true;
              if (!assignees.includes(actor)) {
                try {
                  await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [actor] });
                } catch (error) {
                  assigned = false;
                  core.warning(`GitHub could not assign @${actor}: ${error.message}`);
                }
              }

              const now = new Date();
              const expires = new Date(now.getTime() + days * 24 * 60 * 60 * 1000);
              const marker = `<!-- folio-claim user=${actor} claimed_at=${now.toISOString()} expires_at=${expires.toISOString()} -->`;
              const assignmentNote = assigned ? '' : '\n\n> GitHub 未允许自动写入 Assignee，但 bot 已记录本次认领；每日巡检仍会按此记录处理。';

              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `${marker}\n@${actor} 已认领该任务，认领有效期到 **${expires.toISOString().slice(0, 10)}**。\n\n- 开始提交 PR 时请在 PR 描述中写 \`Closes #${issue_number}\`\n- 需要续期：再次评论 \`/claim\` 或 \`/claim 2w\`\n- 不再处理：评论 \`/release\`${assignmentNote}`
              });
              return;
            }

            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              if (!pr) return;
              const issue_number = pr.number;
              const action = context.payload.action;

              if (action === 'closed') {
                await removeLabel(issue_number, 'needs-review');
                await removeLabel(issue_number, 'waiting-on-author');
                if (pr.merged && pr.user.login !== maintainer) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number,
                    body: `感谢 @${pr.user.login} 的贡献，PR 已合并。`
                  });
                }
                return;
              }

              if (pr.draft) return;

              if (action === 'synchronize') {
                await removeLabel(issue_number, 'waiting-on-author');
                await removeLabel(issue_number, 'approved');
              }

              await addLabel(issue_number, 'needs-review');

              if (pr.user.login !== maintainer) {
                try {
                  await github.rest.pulls.requestReviewers({
                    owner, repo, pull_number: pr.number, reviewers: [maintainer]
                  });
                } catch (error) {
                  core.warning(`Unable to request @${maintainer} review: ${error.message}`);
                }
              }

              if (['opened', 'reopened', 'ready_for_review'].includes(action)) {
                const firstTimer = ['FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR'].includes(pr.author_association);
                const welcome = firstTimer ? '欢迎第一次向 Folio 提交贡献。' : '感谢提交 Folio PR。';
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: `${welcome}\n\nBot 已将此 PR 标记为 \`needs-review\`${pr.user.login !== maintainer ? `，并请求 @${maintainer} Review` : ''}。如果它解决某个 Issue，请确保描述中包含 \`Closes #<issue>\`。\n\n> 社区机器人只做状态流转和提醒，不会自动合并代码。`
                });
              }
              return;
            }

            if (context.eventName === 'pull_request_review') {
              const pr = context.payload.pull_request;
              const review = context.payload.review;
              if (!pr || !review || review.user?.login !== maintainer) return;

              const issue_number = pr.number;
              const state = String(review.state || '').toLowerCase();

              if (state === 'changes_requested') {
                await removeLabel(issue_number, 'needs-review');
                await removeLabel(issue_number, 'approved');
                await addLabel(issue_number, 'waiting-on-author');
              } else if (state === 'approved') {
                await removeLabel(issue_number, 'needs-review');
                await removeLabel(issue_number, 'waiting-on-author');
                await addLabel(issue_number, 'approved');
              }
            }
